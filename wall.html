<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bowen & Zi Qin — Live Photo Wall</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --blush: #f2e0da;
    --rose: #d4a5a0;
    --dusty: #c4978f;
    --sage: #b8c4b1;
    --cream: #faf6f3;
    --warm: #f7eeea;
    --text: #4a3f3d;
    --text-light: #8a7a78;
    --gold: #c9a96e;
    --scroll-speed: 35s;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    color: var(--text);
    overflow: hidden;
    height: 100vh;
    width: 100vw;
  }

  /* Grain texture overlay */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.04'/%3E%3C/svg%3E");
    opacity: 0.4;
    pointer-events: none;
    z-index: 100;
  }

  /* Full-screen layout */
  .wall {
    display: flex;
    flex-direction: column;
    height: 100vh;
    width: 100vw;
    gap: 0;
    position: relative;
  }

  /* Top header strip */
  .wall-header {
    position: relative;
    z-index: 50;
    text-align: center;
    padding: 0.75rem 2rem 0.5rem;
    flex-shrink: 0;
    background: linear-gradient(180deg, var(--cream) 70%, transparent);
  }

  .wedding-label {
    font-size: 0.62rem;
    letter-spacing: 0.4em;
    text-transform: uppercase;
    color: var(--dusty);
    font-weight: 500;
    margin-bottom: 0.3rem;
  }

  .wall-title {
    font-family: 'Cormorant Garamond', serif;
    font-size: clamp(2rem, 5vw, 3.5rem);
    font-weight: 300;
    font-style: italic;
    color: var(--text);
    line-height: 1;
  }

  .wall-title .ampersand {
    color: var(--dusty);
    font-weight: 400;
  }

  .wall-tagline {
    font-size: 0.7rem;
    letter-spacing: 0.2em;
    color: var(--text-light);
    margin-top: 0.4rem;
    font-weight: 300;
  }

  /* Decorative line */
  .deco-line {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0.75rem;
    padding: 0.1rem 0;
    flex-shrink: 0;
  }

  .deco-line::before, .deco-line::after {
    content: '';
    width: 80px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose));
  }
  .deco-line::after { background: linear-gradient(90deg, var(--rose), transparent); }
  .deco-dot { color: var(--rose); font-size: 0.7rem; }

  /* Scroll area — takes remaining height */
  .scroll-area {
    flex: 1;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  /* Three rows of tracks */
  .tracks {
    display: flex;
    flex-direction: column;
    gap: 0.75rem;
    height: 100%;
    padding: 0.25rem 0;
  }

  .track {
    flex: 1;
    overflow: hidden;
    position: relative;
    min-height: 0;
  }

  .track-inner {
    /* JS-driven scroll — tiles are absolutely positioned within the track */
    position: relative;
    height: 100%;
    width: 100%;
  }

  /* Photo tiles */
  .photo-tile {
    position: absolute;
    top: 0;
    height: 100%;
    border-radius: 12px;
    overflow: hidden;
    box-shadow: 0 4px 20px rgba(100,70,65,0.12);
    cursor: default;
    transition: box-shadow 0.3s ease;
  }

  .photo-tile:hover { box-shadow: 0 8px 32px rgba(100,70,65,0.22); z-index: 10; }

  .photo-tile img,
  .photo-tile video {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
  }

  /* Caption overlay */
  .tile-caption {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    background: linear-gradient(transparent, rgba(60,40,38,0.65));
    padding: 2rem 0.85rem 0.75rem;
    opacity: 0;
    transition: opacity 0.3s;
  }

  .photo-tile:hover .tile-caption { opacity: 1; }

  .tile-name {
    font-size: 0.72rem;
    font-weight: 500;
    color: rgba(255,255,255,0.9);
    letter-spacing: 0.05em;
  }

  .tile-msg {
    font-size: 0.68rem;
    color: rgba(255,255,255,0.75);
    font-style: italic;
    line-height: 1.4;
    margin-top: 0.15rem;
  }


  /* Bottom footer strip */
  .wall-footer {
    position: relative;
    z-index: 50;
    text-align: center;
    padding: 0.4rem 2rem 0.75rem;
    flex-shrink: 0;
    background: linear-gradient(0deg, var(--cream) 60%, transparent);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1.5rem;
  }

  .footer-item {
    font-size: 0.62rem;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--text-light);
    font-weight: 300;
  }

  .footer-dot { color: var(--rose); }

  /* Live indicator */
  .live-badge {
    display: flex;
    align-items: center;
    gap: 0.4rem;
    font-size: 0.62rem;
    letter-spacing: 0.15em;
    color: var(--approve, #7a9e7a);
  }

  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #7a9e7a;
    animation: pulse-dot 2s ease-in-out infinite;
  }

  @keyframes pulse-dot {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* New photo flash animation */
  .photo-tile.new-photo {
    animation: new-pop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes new-pop {
    from { transform: scale(0.85); opacity: 0; }
    to { transform: scale(1); opacity: 1; }
  }


  /* Photo count display */
  #photoCount {
    font-family: 'Cormorant Garamond', serif;
    font-size: 0.85rem;
    font-style: italic;
    color: var(--dusty);
  }

  /* QR hint */
  .qr-hint {
    position: fixed;
    bottom: 1rem;
    right: 1.5rem;
    font-size: 0.6rem;
    letter-spacing: 0.1em;
    color: var(--text-light);
    opacity: 0.5;
    z-index: 200;
  }

  /* Login gate */
  .login-gate {
    position: fixed;
    inset: 0;
    background: var(--cream);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 500;
    padding: 2rem;
  }
  .login-gate.hidden { display: none; }

  .login-box {
    background: #fff9f7;
    border: 1.5px solid #e8ddd9;
    border-radius: 24px;
    padding: 3rem 2.5rem 2.5rem;
    width: 100%;
    max-width: 380px;
    text-align: center;
    box-shadow: 0 12px 48px rgba(180,130,120,0.12);
  }

  .login-monogram {
    font-family: 'Cormorant Garamond', serif;
    font-size: 2.8rem;
    font-weight: 300;
    font-style: italic;
    color: var(--dusty);
    line-height: 1;
    margin-bottom: 0.25rem;
  }

  .login-date {
    font-size: 0.6rem;
    letter-spacing: 0.35em;
    text-transform: uppercase;
    color: var(--text-light);
    margin-bottom: 2rem;
  }

  .login-label {
    font-size: 0.62rem;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dusty);
    margin-bottom: 0.6rem;
    font-weight: 500;
  }

  .login-input {
    width: 100%;
    padding: 0.85rem 1.25rem;
    border: 1.5px solid #e8ddd9;
    border-radius: 12px;
    background: var(--cream);
    font-family: 'Jost', sans-serif;
    font-size: 1rem;
    color: var(--text);
    outline: none;
    text-align: center;
    letter-spacing: 0.25em;
    margin-bottom: 1rem;
    transition: border-color 0.2s;
  }
  .login-input:focus { border-color: var(--rose); }

  .login-btn {
    width: 100%;
    padding: 0.9rem;
    background: linear-gradient(135deg, var(--rose), var(--dusty));
    border: none;
    border-radius: 12px;
    color: white;
    font-family: 'Cormorant Garamond', serif;
    font-size: 1.1rem;
    font-style: italic;
    letter-spacing: 0.05em;
    cursor: pointer;
    box-shadow: 0 4px 20px rgba(180,130,120,0.3);
    transition: all 0.2s;
  }
  .login-btn:hover { transform: translateY(-1px); }

  .login-error {
    color: #b97070;
    font-size: 0.72rem;
    margin-top: 0.75rem;
    letter-spacing: 0.05em;
    min-height: 1rem;
  }

  .login-deco {
    display: flex;
    align-items: center;
    gap: 0.6rem;
    margin-bottom: 1.5rem;
  }
  .login-deco::before, .login-deco::after {
    content: '';
    flex: 1;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--rose));
  }
  .login-deco::after { background: linear-gradient(90deg, var(--rose), transparent); }
  .login-deco span { color: var(--rose); font-size: 0.65rem; }
</style>
</head>
<body>


<!-- Login Gate -->
<div class="login-gate" id="loginGate">
  <div class="login-box">
    <div class="login-monogram">B &amp; ZQ</div>
    <div class="login-date">6 · XII · 2026</div>
    <div class="login-deco"><span>✦</span></div>
    <div class="login-label">Enter passcode to view</div>
    <input class="login-input" id="wallPassInput" type="password" placeholder="· · · · · · · ·" maxlength="30">
    <button class="login-btn" id="wallLoginBtn">Enter the wall</button>
    <div class="login-error" id="wallLoginError"></div>
  </div>
</div>

<div class="wall" id="wall">
  <div class="wall-header">
    <div class="wedding-label">6 · XII · 2026 &nbsp;·&nbsp; Singapore</div>
    <div class="wall-title">Bowen <span class="ampersand">&</span> Zi Qin</div>
    <div class="wall-tagline">our story, your moments</div>
  </div>

  <div class="deco-line"><span class="deco-dot">✦</span></div>

  <div class="scroll-area" id="scrollArea">
    <div class="tracks" id="tracks">
      <div class="track" id="track0"><div class="track-inner" id="inner0"></div></div>
      <div class="track" id="track1"><div class="track-inner" id="inner1"></div></div>
      <div class="track" id="track2"><div class="track-inner" id="inner2"></div></div>
    </div>
  </div>

  <div class="wall-footer">
    <span class="footer-item">Paradox Singapore Merchant Court</span>
    <span class="footer-dot">✦</span>
    <span id="photoCount">Loading…</span>
    <span class="footer-dot">✦</span>
    <div class="live-badge"><div class="live-dot"></div>Live</div>
  </div>
</div>

<div class="qr-hint">Hover to pause &nbsp;·&nbsp; Updates every 15s</div>

<script>
  // ── CONFIG ──────────────────────────────────────────────────────────────
  const GAS_URL = 'https://script.google.com/macros/s/AKfycbwMTZYvLpvSGnOR-FV1KJn72fQm3eyU5QqFVrSk2ri7jPiPqYcQjqPKKm-omKPWXOKC/exec';
  const POLL_INTERVAL = 15000; // ms

  // SHA-256 hash of the passcode (same as moderate.html)
  // To change: run in browser console:
  //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('your_passcode'))
  //     .then(b => console.log([...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')))
  const PASSCODE_HASH = 'f363ff74323b3147ac864ab0661a4a727dc39b8e91d0e27d623859366855b888';
  // ────────────────────────────────────────────────────────────────────────

  async function sha256(str) {
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(str));
    return [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  }

  // ── Auth ─────────────────────────────────────────────────────────────────
  function checkLogin() { return sessionStorage.getItem('wall_auth') === 'true'; }

  document.getElementById('wallLoginBtn').addEventListener('click', doLogin);
  document.getElementById('wallPassInput').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function doLogin() {
    const val = document.getElementById('wallPassInput').value;
    const hash = await sha256(val);
    if (hash === PASSCODE_HASH) {
      sessionStorage.setItem('wall_auth', 'true');
      document.getElementById('loginGate').classList.add('hidden');
      init();
    } else {
      document.getElementById('wallLoginError').textContent = 'Incorrect passcode';
      document.getElementById('wallPassInput').value = '';
    }
  }

  if (checkLogin()) {
    document.getElementById('loginGate').classList.add('hidden');
  }
  // ─────────────────────────────────────────────────────────────────────────

  let approvedPhotos = [];
  let seenIds = new Set();
  let initialized = false;

  async function fetchPhotos() {
    try {
      const resp = await fetch(`${GAS_URL}?action=wall`);
      const json = await resp.json();
      if (json.success && json.photos) {
        return json.photos;
      }
    } catch (e) {}
    return null;
  }

  function buildTile(photo) {
    const tile = document.createElement('div');
    tile.className = 'photo-tile';
    tile.dataset.id = photo.id;

    const isVideo = photo.mediaType === 'video';

    if (isVideo) {
      const vid = document.createElement('video');
      vid.autoplay = true;
      vid.muted = true;
      vid.loop = true;
      vid.playsInline = true;
      // Use <source> with explicit type so browser knows the codec
      // without needing correct Content-Type headers from Drive
      const src = document.createElement('source');
      src.src = videoSrc(photo.driveUrl);
      src.type = photo.mimeType || 'video/mp4';
      vid.appendChild(src);
      tile.appendChild(vid);

      // Small video indicator badge
      const badge = document.createElement('div');
      badge.style.cssText = 'position:absolute;top:0.5rem;right:0.5rem;background:rgba(0,0,0,0.45);color:white;font-size:0.58rem;padding:0.2rem 0.5rem;border-radius:100px;letter-spacing:0.08em;z-index:5;';
      badge.textContent = '▶';
      tile.appendChild(badge);
    } else {
      const img = document.createElement('img');
      img.src = photo.thumbnailUrl || photo.driveUrl;
      img.alt = photo.name || '';
      img.loading = 'lazy';
      tile.appendChild(img);
    }

    if (photo.name || photo.caption) {
      const cap = document.createElement('div');
      cap.className = 'tile-caption';
      if (photo.name) {
        const nm = document.createElement('div');
        nm.className = 'tile-name';
        nm.textContent = photo.name;
        cap.appendChild(nm);
      }
      if (photo.caption) {
        const msg = document.createElement('div');
        msg.className = 'tile-msg';
        msg.textContent = photo.caption;
        cap.appendChild(msg);
      }
      tile.appendChild(cap);
    }

    return tile;
  }

  // ── JS Scroll Engine ──────────────────────────────────────────────────────
  // Each track has its own state. Tiles are absolutely positioned and moved
  // via JS each frame. No DOM duplication — each photo tile exists exactly once.

  const TRACK_COUNT = 3;
  const GAP = 24; // px — horizontal spacing between tiles
  // Slightly different speeds per row for visual variety
  const SPEEDS = [55, 45, 62]; // px/sec — relaxed pace for a wall display

  // Track state: array of { tiles: [{el, x, w}], totalW, running, speed }
  const trackStates = [];
  let rafId = null;
  let lastTime = null;

  function distributeTiles(photos) {
    const tracks = [[], [], []];
    photos.forEach((p, i) => { tracks[i % 3].push(p); });
    return tracks;
  }

  async function populateTracks(photos) {
    if (rafId) { cancelAnimationFrame(rafId); rafId = null; lastTime = null; }

    const innerEls = [
      document.getElementById('inner0'),
      document.getElementById('inner1'),
      document.getElementById('inner2'),
    ];

    innerEls.forEach(el => { el.innerHTML = ''; });
    trackStates.length = 0;

    if (photos.length === 0) {
      document.getElementById('photoCount').textContent = '';
      return;
    }

    // Pre-detect portrait/landscape for each photo by loading its thumbnail.
    // Runs in parallel with a 3s timeout so a slow image never stalls the wall.
    await Promise.all(photos.map(p => new Promise(resolve => {
      if (p.mediaType === 'video') { p.isPortrait = false; resolve(); return; }
      const timeout = setTimeout(() => { p.isPortrait = false; resolve(); }, 3000);
      const img = new Image();
      img.onload = () => {
        clearTimeout(timeout);
        p.isPortrait = img.naturalHeight > img.naturalWidth;
        resolve();
      };
      img.onerror = () => { clearTimeout(timeout); p.isPortrait = false; resolve(); };
      img.src = p.thumbnailUrl || p.driveUrl;
    })));

    const trackData = distributeTiles(photos);

    innerEls.forEach((inner, ti) => {
      const trackPhotos = trackData[ti].length > 0 ? trackData[ti] : photos;
      const trackW = inner.parentElement.clientWidth;
      const trackH = inner.parentElement.clientHeight || 200;

      // Build tiles with per-photo width based on detected orientation
      const tiles = trackPhotos.map(p => {
        const tile = buildTile(p);
        tile.style.position = 'absolute';
        tile.style.top = '0';
        const aspect = p.isPortrait ? (3 / 4) : (4 / 3);
        const tileW  = Math.round(trackH * aspect);
        tile.style.width = tileW + 'px';
        inner.appendChild(tile);
        return { el: tile, w: tileW, x: 0 };
      });

      // Always scroll — if tiles don't fill the screen, duplicate the photo
      // objects (not DOM elements) until we have enough content to cover
      // at least 2× trackW. This ensures every row scrolls continuously.
      let allTiles = tiles.slice();
      const basePhotos = trackPhotos.slice();
      let safetyLimit = 0;
      while (
        allTiles.reduce((s, t) => s + t.w + GAP, 0) < trackW * 2 &&
        safetyLimit++ < 20
      ) {
        basePhotos.forEach(p => {
          const tile = buildTile(p);
          tile.style.position = 'absolute';
          tile.style.top = '0';
          const aspect = p.isPortrait ? (3 / 4) : (4 / 3);
          const tileW  = Math.round(trackH * aspect);
          tile.style.width = tileW + 'px';
          inner.appendChild(tile);
          allTiles.push({ el: tile, w: tileW, x: 0 });
        });
      }

      const totalW   = allTiles.reduce((s, t) => s + t.w + GAP, 0) - GAP;
      const cycleW   = Math.max(totalW + GAP, trackW);
      const n        = allTiles.length;
      const step     = cycleW / n;
      const rowPhase = ti * (trackW / 3.3);

      allTiles.forEach((t, idx) => {
        const cx = ((idx * step) + rowPhase) % cycleW;
        t.el.style.left = cx + 'px';
        t.x = cx;
      });

      trackStates.push({ inner, tiles: allTiles, speed: SPEEDS[ti], ti, trackW, running: true });
    });

    lastTime = null;
    rafId = requestAnimationFrame(tick);

    const count = photos.length;
    document.getElementById('photoCount').textContent =
      `${count} moment${count !== 1 ? 's' : ''} shared`;
  }

  function tick(now) {
    const dt = lastTime ? Math.min((now - lastTime) / 1000, 0.05) : 0;
    lastTime = now;

    trackStates.forEach(state => {
      if (!state.running || !state.tiles) return;
      const { tiles, speed } = state;

      // Step 1: move every tile left
      tiles.forEach(t => {
        t.x -= speed * dt;
      });

      // Step 2: collect tiles that have fully exited the left edge,
      // sorted by their current x so we recycle left-most first
      const toRecycle = tiles
        .filter(t => t.x + t.w < 0)
        .sort((a, b) => a.x - b.x);

      // Step 3: recycle each one in order, placing it after the
      // current rightmost tile (recalculated after each placement
      // so tiles don't stack on top of each other)
      toRecycle.forEach(t => {
        const maxX = Math.max(...tiles.map(o => o.x + o.w));
        t.x = maxX + GAP;
      });

      // Step 4: apply positions to DOM
      tiles.forEach(t => {
        t.el.style.left = t.x + 'px';
      });
    });

    rafId = requestAnimationFrame(tick);
  }

  async function init() {
    const photos = await fetchPhotos();
    if (photos !== null) {
      approvedPhotos = photos;
      photos.forEach(p => seenIds.add(p.id));
      populateTracks(approvedPhotos);  // async, no need to await in poll
    } else {
      populateTracks([]);
    }
    initialized = true;
  }

  async function pollForUpdates() {
    const photos = await fetchPhotos();
    if (!photos) return;

    const newPhotos = photos.filter(p => !seenIds.has(p.id));
    if (newPhotos.length > 0) {
      newPhotos.forEach(p => seenIds.add(p.id));
      approvedPhotos = photos;
      // Animate new tiles in
      populateTracks(approvedPhotos);  // async, no need to await in poll
    }
  }

  if (checkLogin()) init();
  setInterval(() => { if (checkLogin()) pollForUpdates(); }, POLL_INTERVAL);

  // Normalise Drive URLs for video — the uc?export=view format doesn't stream
  // reliably in <video> tags. Convert to lh3.googleusercontent.com/d/FILE_ID.
  function videoSrc(url) {
    if (!url) return '';
    // Extract Drive file ID from any Drive URL format
    const m = url.match(/[?&]id=([a-zA-Z0-9_-]+)/)
           || url.match(/\/d\/([a-zA-Z0-9_-]+)/)
           || url.match(/lh3\.googleusercontent\.com\/d\/([a-zA-Z0-9_-]+)/);
    if (m) {
      // export=download works for "anyone with link" files without requiring sign-in
      return `https://drive.google.com/uc?export=download&id=${m[1]}`;
    }
    return url;
  }
</script>
</body>
</html>
